# Checks awards.csv on every pull request.
name: Check awards.csv

on:
  pull_request:
    paths: ["awards.csv", "scripts/**"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python scripts/build_readme.py --check
