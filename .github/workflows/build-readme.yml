# Rebuilds README.md from awards.csv after every change.
name: Build README

on:
  push:
    branches: [master]
    paths: ["awards.csv", "scripts/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python scripts/build_readme.py
      - name: Commit README.md if it changed
        run: |
          if git diff --quiet -- README.md; then
            echo "README.md is already up to date."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "Rebuild README from awards.csv"
            git push
          fi
