# Checks every link in README.md on the first of each month and opens an issue
# when some no longer work. Several societies block automated visitors, so the
# codes 403 and 429 are counted as "working".
name: Check links

on:
  schedule:
    - cron: "41 6 1 * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: --accept 200,206,403,429 --timeout 30 --max-retries 2 --no-progress README.md
          fail: false
      - name: Open an issue if links are broken
        if: steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: Links that need attention
          content-filepath: ./lychee/out.md
          labels: correction
